<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="dashcam-token" content="__DASHCAM_TOKEN__" />
  <title>agent-dashcam</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ff3b4f'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="rec-dot"></span><span class="rec">REC</span> agent-dashcam</div>
    <div class="project" id="project" title=""></div>
    <span class="badge demo hidden" id="demoBadge">DEMO SANDBOX</span>
    <div class="spacer"></div>
    <select id="sessionSelect" title="Session"></select>
    <div class="stats" id="stats"></div>
  </header>

  <section class="scrubber">
    <div class="controls">
      <button id="prevBtn" title="Previous event (←)">⏮</button>
      <button id="playBtn" class="play" title="Play / pause (space)">▶</button>
      <button id="nextBtn" title="Next event (→)">⏭</button>
      <select id="speed" title="Playback speed">
        <option value="1">1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="8">8×</option>
      </select>
      <button id="nextRiskBtn" class="risk-btn" title="Jump to next risk (r)">⚠ Next risk</button>
      <div class="clock" id="clock">--:--:--</div>
    </div>
    <div class="track" id="track">
      <div class="track-line"></div>
      <div class="ticks" id="ticks"></div>
      <div class="playhead" id="playhead"></div>
    </div>
    <div class="track-labels"><span id="tStart"></span><span id="tEnd"></span></div>
  </section>

  <main class="layout">
    <aside class="list-pane">
      <div class="filters" id="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="risk">⚠ Risks</button>
        <button data-filter="file">Files</button>
        <button data-filter="shell">Shell</button>
        <button data-filter="checkpoint">Checkpoints</button>
      </div>
      <input id="search" type="search" placeholder="Filter events…" />
      <ol class="events" id="events"></ol>
    </aside>
    <section class="detail-pane" id="detail">
      <div class="empty">Select an event to inspect it.</div>
    </section>
  </main>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Rewind preview</h2>
        <button class="close" id="modalClose" title="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>
  <div class="toast hidden" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
